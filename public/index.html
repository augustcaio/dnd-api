<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D&D 5e — Guia do Mestre API</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>D&amp;D&nbsp;5e <span>|</span> Guia do Mestre</h1>
      <span class="badge" id="health-badge">...</span>
      <div class="spacer"></div>
      <div class="links">
        <a href="/api/docs" target="_blank">Docs</a>
        <a href="https://github.com/augustcaio/dnd-api" target="_blank">GitHub</a>
      </div>
    </div>

    <div class="search-bar">
      <input type="text" id="search" placeholder="Filtrar endpoints ou buscar na API..." autocomplete="off" spellcheck="false">
      <span class="search-hint" id="search-hint">&nbsp;</span>
    </div>

    <div class="main">
      <div class="sidebar" id="sidebar"></div>
      <div class="content" id="content">
        <div class="welcome" id="welcome">
          <h2>&#9876; API Explorer</h2>
          <p>Clique em um endpoint na barra lateral para executar uma requisi&ccedil;&atilde;o e visualizar a resposta.</p>
        </div>
      </div>
    </div>

    <div class="history">
      <div class="history-dropdown" id="history-dropdown"></div>
      <button class="history-toggle" id="history-toggle">Hist&oacute;rico</button>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
