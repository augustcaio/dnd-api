<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D&D 5e — Guia do Mestre API</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f0f; color: #e0e0e0; line-height: 1.5; overflow: hidden; height: 100vh; }
    
    .app { display: flex; flex-direction: column; height: 100vh; }
    .header { padding: 0.75rem 1.5rem; background: #151515; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
    .header h1 { font-size: 1.1rem; color: #c44; white-space: nowrap; }
    .header h1 span { color: #666; }
    .badge { padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
    .badge.ok { background: #1a3a1a; color: #4c4; border: 1px solid #2a5a2a; }
    .badge.err { background: #3a1a1a; color: #c44; border: 1px solid #5a2a2a; }
    .badge.soon { background: #2a2a1a; color: #aa4; border: 1px solid #4a4a2a; }
    .header .spacer { flex: 1; }
    .header .links { display: flex; gap: 0.75rem; }
    .header .links a { color: #68c; font-size: 0.8rem; text-decoration: none; }
    .header .links a:hover { text-decoration: underline; }

    .search-bar { padding: 0.5rem 1.5rem; background: #111; border-bottom: 1px solid #222; display: flex; gap: 0.5rem; flex-shrink: 0; }
    .search-bar input { flex: 1; padding: 0.5rem 0.75rem; background: #1a1a1a; border: 1px solid #333; border-radius: 4px; color: #e0e0e0; font-size: 0.875rem; }
    .search-bar input:focus { outline: none; border-color: #68c; }
    .search-bar input::placeholder { color: #555; }
    .search-bar .search-hint { font-size: 0.7rem; color: #555; align-self: center; white-space: nowrap; }

    .main { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 280px; min-width: 200px; border-right: 1px solid #222; overflow-y: auto; flex-shrink: 0; background: #111; }
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-track { background: #111; }
    .sidebar::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    .section-title { padding: 0.5rem 1rem; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: #666; background: #0d0d0d; border-bottom: 1px solid #1a1a1a; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 0.5rem; }
    .section-title:hover { color: #999; }
    .section-title .arrow { transition: transform 0.15s; font-size: 0.6rem; }
    .section-title .arrow.open { transform: rotate(90deg); }
    .section-title .count { margin-left: auto; font-size: 0.65rem; color: #555; }
    .ep { padding: 0.35rem 1rem 0.35rem 1.75rem; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; border-left: 2px solid transparent; transition: all 0.1s; }
    .ep:hover { background: #1a1a2a; border-left-color: #68c; }
    .ep.active { background: #1a1a2a; border-left-color: #68c; }
    .ep .method { font-weight: 700; font-size: 0.7rem; width: 4ch; flex-shrink: 0; }
    .ep .method.get { color: #4c4; }
    .ep .method.post { color: #c8c; }
    .ep .path { color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ep .status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .ep .status-dot.live { background: #4c4; }
    .ep .status-dot.soon { background: #aa4; }
    .ep.hidden { display: none; }

    .content { flex: 1; overflow-y: auto; padding: 1.5rem; }
    .content::-webkit-scrollbar { width: 8px; }
    .content::-webkit-scrollbar-track { background: #0f0f0f; }
    .content::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    .welcome { text-align: center; padding: 3rem 1rem; color: #555; }
    .welcome h2 { font-size: 1.5rem; color: #444; margin-bottom: 0.5rem; }
    .welcome p { font-size: 0.9rem; max-width: 400px; margin: 0 auto; }

    .response-panel {}
    .response-panel .meta { display: flex; gap: 1rem; margin-bottom: 0.75rem; font-size: 0.8rem; flex-wrap: wrap; }
    .response-panel .meta .status-code { font-weight: 700; }
    .response-panel .meta .status-code.ok { color: #4c4; }
    .response-panel .meta .status-code.err { color: #c44; }
    .response-panel .meta .latency { color: #888; }
    .response-panel .meta .endpoint-label { color: #68c; font-family: monospace; }
    .response-panel .meta .clear-btn { margin-left: auto; background: none; border: 1px solid #333; color: #888; padding: 0.15rem 0.5rem; border-radius: 3px; cursor: pointer; font-size: 0.75rem; }
    .response-panel .meta .clear-btn:hover { color: #c44; border-color: #c44; }
    pre.json { background: #0a0a0a; padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 0.8rem; line-height: 1.6; border: 1px solid #1a1a1a; position: relative; }
    pre.json .copy-btn { position: absolute; top: 0.5rem; right: 0.5rem; background: #1a1a1a; border: 1px solid #333; color: #888; padding: 0.2rem 0.5rem; border-radius: 3px; cursor: pointer; font-size: 0.7rem; }
    pre.json .copy-btn:hover { color: #e0e0e0; }
    .json .key { color: #68c; }
    .json .string { color: #8c8; }
    .json .number { color: #c8c; }
    .json .boolean { color: #ca4; }
    .json .null { color: #888; }
    .json .bracket { color: #666; }

    .gen-form { background: #111; border: 1px solid #222; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
    .gen-form h3 { font-size: 0.9rem; color: #c8c; margin-bottom: 0.75rem; }
    .gen-form .field { margin-bottom: 0.5rem; }
    .gen-form label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 0.2rem; }
    .gen-form select, .gen-form input { width: 100%; padding: 0.4rem 0.6rem; background: #1a1a1a; border: 1px solid #333; border-radius: 3px; color: #e0e0e0; font-size: 0.8rem; }
    .gen-form select:focus, .gen-form input:focus { outline: none; border-color: #c8c; }
    .gen-form button { width: 100%; padding: 0.5rem; background: #2a1a2a; border: 1px solid #4a2a4a; border-radius: 4px; color: #c8c; cursor: pointer; font-weight: 600; font-size: 0.8rem; margin-top: 0.25rem; }
    .gen-form button:hover { background: #3a2a3a; }
    .gen-form button:disabled { opacity: 0.5; cursor: not-allowed; }

    .history { position: fixed; bottom: 0.75rem; right: 1.5rem; }
    .history-toggle { background: #1a1a1a; border: 1px solid #333; color: #666; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .history-toggle:hover { color: #e0e0e0; }
    .history-dropdown { display: none; position: absolute; bottom: 100%; right: 0; margin-bottom: 0.5rem; background: #1a1a1a; border: 1px solid #333; border-radius: 6px; min-width: 280px; max-height: 300px; overflow-y: auto; }
    .history-dropdown.open { display: block; }
    .history-item { padding: 0.4rem 0.75rem; font-size: 0.75rem; cursor: pointer; display: flex; gap: 0.5rem; }
    .history-item:hover { background: #222; }
    .history-item .hmethod { font-weight: 700; width: 4ch; }
    .history-item .hmethod.get { color: #4c4; }
    .history-item .hmethod.post { color: #c8c; }
    .history-item .hpath { color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-item .htime { color: #555; margin-left: auto; white-space: nowrap; }

    @media (max-width: 700px) {
      .sidebar { width: 200px; min-width: 160px; }
      .header { padding: 0.5rem 0.75rem; gap: 0.5rem; }
      .header h1 { font-size: 0.9rem; }
      .content { padding: 1rem; }
      .ep { padding: 0.3rem 0.5rem 0.3rem 1rem; font-size: 0.75rem; }
      .section-title { padding: 0.4rem 0.5rem; font-size: 0.65rem; }
    }
    @media (max-width: 500px) {
      .main { flex-direction: column; }
      .sidebar { width: 100%; max-height: 40vh; border-right: none; border-bottom: 1px solid #222; }
      .content { max-height: 60vh; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>D&amp;D&nbsp;5e <span>|</span> Guia do Mestre</h1>
      <span class="badge" id="health-badge">...</span>
      <div class="spacer"></div>
      <div class="links">
        <a href="/api/docs" target="_blank">Docs</a>
        <a href="https://github.com/augustcaio/dnd-api" target="_blank">GitHub</a>
      </div>
    </div>

    <div class="search-bar">
      <input type="text" id="search" placeholder="Filtrar endpoints ou buscar na API..." autocomplete="off" spellcheck="false">
      <span class="search-hint" id="search-hint">&nbsp;</span>
    </div>

    <div class="main">
      <div class="sidebar" id="sidebar"></div>
      <div class="content" id="content">
        <div class="welcome" id="welcome">
          <h2>&#9876; API Explorer</h2>
          <p>Clique em um endpoint na barra lateral para executar uma requisi&ccedil;&atilde;o e visualizar a resposta.</p>
        </div>
      </div>
    </div>

    <div class="history">
      <div class="history-dropdown" id="history-dropdown"></div>
      <button class="history-toggle" id="history-toggle">Hist&oacute;rico</button>
    </div>
  </div>

  <script>
    const ENDPOINTS = [
      { section: 'Status', items: [
        { method: 'GET', path: '/api/health', label: 'Status da API', status: 'live' },
      ]},
      { section: 'Mundo', items: [
        { method: 'GET', path: '/api/deities', label: 'Divindades', status: 'live' },
        { method: 'GET', path: '/api/deities/:id', label: 'Divindade por ID', status: 'soon', params: [{ name: 'id', eg: '1' }] },
        { method: 'GET', path: '/api/planes', label: 'Planos de existência', status: 'live' },
        { method: 'GET', path: '/api/planes/:id', label: 'Plano por ID', status: 'soon', params: [{ name: 'id', eg: '1' }] },
      ]},
      { section: 'Tesouro', items: [
        { method: 'GET', path: '/api/items', label: 'Itens mágicos', status: 'soon' },
        { method: 'GET', path: '/api/items/artifacts', label: 'Artefatos', status: 'soon' },
        { method: 'GET', path: '/api/treasures/gems', label: 'Gemas', status: 'soon' },
        { method: 'GET', path: '/api/treasures/art-objects', label: 'Objetos de arte', status: 'soon' },
      ]},
      { section: 'Ameaças', items: [
        { method: 'GET', path: '/api/hazards/poisons', label: 'Venenos', status: 'soon' },
        { method: 'GET', path: '/api/hazards/diseases', label: 'Doenças', status: 'soon' },
        { method: 'GET', path: '/api/hazards/madness', label: 'Loucura', status: 'soon' },
        { method: 'GET', path: '/api/monsters/list', label: 'Monstros', status: 'soon' },
        { method: 'GET', path: '/api/monsters/stats-by-cr', label: 'Estatísticas por ND', status: 'soon' },
      ]},
      { section: 'Regras', items: [
        { method: 'GET', path: '/api/rules/ability-checks', label: 'Testes de habilidade', status: 'soon' },
        { method: 'GET', path: '/api/rules/difficulty-classes', label: 'Classes de dificuldade', status: 'soon' },
        { method: 'GET', path: '/api/rules/saving-throws', label: 'Testes de resistência', status: 'soon' },
        { method: 'GET', path: '/api/rules/xp-by-cr', label: 'XP por ND', status: 'soon' },
        { method: 'GET', path: '/api/rules/siege-weapons', label: 'Armas de cerco', status: 'soon' },
        { method: 'GET', path: '/api/rules/optional', label: 'Regras opcionais', status: 'soon' },
      ]},
      { section: 'Geradores', items: [
        { method: 'POST', path: '/api/adventures/generate', label: 'Gerar aventura', status: 'soon', body: { type: 'location|event|mystery|intrigue' } },
        { method: 'POST', path: '/api/npcs/generate', label: 'Gerar NPC', status: 'soon', body: { type: 'villain|ally|contact|hireling' } },
        { method: 'POST', path: '/api/dungeons/generate', label: 'Gerar masmorra', status: 'soon', body: { type: 'covil|labirinto|mina|tumba', levels: 'number', rooms: 'number' } },
        { method: 'POST', path: '/api/monsters/create-quick', label: 'Monstro rápido', status: 'soon', body: { intendedCR: 'number', name: 'string' } },
      ]},
      { section: 'Downtime & Campanha', items: [
        { method: 'GET', path: '/api/downtime/activities', label: 'Atividades downtime', status: 'soon' },
        { method: 'GET', path: '/api/campaign/maintenance-costs', label: 'Custos de propriedade', status: 'soon' },
        { method: 'GET', path: '/api/campaign/events/roll', label: 'Evento de campanha', status: 'soon' },
      ]},
    ];

    const COLORS = {
      get: '#4c4', post: '#c8c', put: '#68c', del: '#c44',
    };

    let history = JSON.parse(sessionStorage.getItem('api-history') || '[]');
    let activePath = null;
    let sectionsCollapsed = JSON.parse(sessionStorage.getItem('sections-collapsed') || '{}');

    function renderSidebar(filter) {
      const sidebar = document.getElementById('sidebar');
      sidebar.innerHTML = '';
      ENDPOINTS.forEach((section, si) => {
        const items = filter
          ? section.items.filter(e => matchesFilter(e, filter))
          : section.items;
        if (items.length === 0 && filter) return;

        const isCollapsed = sectionsCollapsed[section.section] || false;
        const sec = document.createElement('div');
        sec.className = 'section-title';
        sec.innerHTML = `
          <span class="arrow ${isCollapsed ? '' : 'open'}">&#9654;</span>
          ${section.section}
          <span class="count">${items.length}/${section.items.length}</span>
        `;
        sec.addEventListener('click', () => {
          sectionsCollapsed[section.section] = !sectionsCollapsed[section.section];
          sessionStorage.setItem('sections-collapsed', JSON.stringify(sectionsCollapsed));
          renderSidebar(document.getElementById('search').value);
        });

        sidebar.appendChild(sec);

        if (!isCollapsed) {
          items.forEach(ep => {
            const el = document.createElement('div');
            el.className = `ep ${activePath === ep.path ? 'active' : ''}`;
            if (filter && !matchesFilter(ep, filter)) el.classList.add('hidden');
            el.innerHTML = `
              <span class="status-dot ${ep.status}"></span>
              <span class="method ${ep.method.toLowerCase()}">${ep.method}</span>
              <span class="path">${shortPath(ep.path)}</span>
            `;
            el.addEventListener('click', () => handleEndpointClick(ep));
            sidebar.appendChild(el);
          });
        }
      });
      updateSearchHint(filter);
    }

    function matchesFilter(ep, filter) {
      const q = filter.toLowerCase();
      return ep.path.toLowerCase().includes(q) || ep.label.toLowerCase().includes(q) || ep.section?.toLowerCase().includes(q);
    }

    function shortPath(p) {
      return p.length > 28 ? p.slice(0, 25) + '..' : p;
    }

    function updateSearchHint(filter) {
      const hint = document.getElementById('search-hint');
      if (!filter) { hint.textContent = `${countEndpoints()} endpoints`; return; }
      const visible = document.querySelectorAll('.ep:not(.hidden)').length;
      hint.textContent = `${visible} resultados`;
    }

    function countEndpoints() {
      return ENDPOINTS.reduce((s, sec) => s + sec.items.length, 0);
    }

    function handleEndpointClick(ep) {
      if (ep.method === 'POST') {
        showGeneratorForm(ep);
      } else if (ep.status === 'soon') {
        fetchEndpoint(ep);
      } else {
        fetchEndpoint(ep);
      }
    }

    async function fetchEndpoint(ep, body) {
      const content = document.getElementById('content');
      const welcome = document.getElementById('welcome');
      if (welcome) welcome.style.display = 'none';

      const start = performance.now();
      let panel = content.querySelector('.response-panel');
      if (!panel) {
        panel = document.createElement('div');
        panel.className = 'response-panel';
        content.appendChild(panel);
      }

      panel.innerHTML = '<div style="text-align:center;padding:2rem;color:#555;">Carregando...</div>';

      try {
        const opts = { headers: { 'Accept': 'application/json' } };
        if (body) {
          opts.method = 'POST';
          opts.headers['Content-Type'] = 'application/json';
          opts.body = JSON.stringify(body);
        }
        const res = await fetch(ep.path, opts);
        const latency = ((performance.now() - start) / 1000).toFixed(2);
        const data = await res.json();
        const ok = res.ok ? 'ok' : 'err';

        panel.innerHTML = `
          <div class="meta">
            <span class="status-code ${ok}">${res.status} ${res.statusText}</span>
            <span class="latency">${latency}s</span>
            <span class="endpoint-label">${ep.method} ${ep.path}</span>
            <button class="clear-btn" onclick="this.closest('.response-panel').remove();showWelcome()">Limpar</button>
          </div>
          <pre class="json"><button class="copy-btn" onclick="copyJson(this)">Copiar</button>${formatJson(data)}</pre>
        `;

        addHistory(ep.method, ep.path, res.status);
        document.querySelectorAll('.ep').forEach(e => e.classList.remove('active'));
        document.querySelectorAll('.ep').forEach(e => {
          if (e.querySelector('.path')?.textContent.trim() === shortPath(ep.path)) e.classList.add('active');
        });
      } catch (err) {
        panel.innerHTML = `
          <div class="meta">
            <span class="status-code err">Erro</span>
            <span class="endpoint-label">${ep.method} ${ep.path}</span>
            <button class="clear-btn" onclick="this.closest('.response-panel').remove();showWelcome()">Limpar</button>
          </div>
          <pre class="json"><span style="color:#c44;">Erro de conexão: ${err.message}</span></pre>
        `;
      }
    }

    function showGeneratorForm(ep) {
      const content = document.getElementById('content');
      const welcome = document.getElementById('welcome');
      if (welcome) welcome.style.display = 'none';

      let panel = content.querySelector('.response-panel');
      if (panel) panel.remove();

      const gen = document.createElement('div');
      gen.className = 'gen-form';
      gen.innerHTML = `<h3>${ep.method} ${ep.path}</h3><p style="font-size:0.8rem;color:#888;margin-bottom:0.75rem;">${ep.label}</p>`;
      gen.dataset.path = ep.path;
      gen.dataset.method = ep.method;

      if (ep.path === '/api/adventures/generate') {
        gen.innerHTML += `
          <div class="field"><label>Tipo de aventura</label><select id="gen-type">
            <option value="location">Baseada em local</option>
            <option value="event">Baseada em evento</option>
            <option value="mystery">Mistério</option>
            <option value="intrigue">Intriga</option>
          </select></div>
          <button onclick="executeGen(this)">Gerar Aventura</button>
        `;
      } else if (ep.path === '/api/npcs/generate') {
        gen.innerHTML += `
          <div class="field"><label>Tipo de NPC</label><select id="gen-type">
            <option value="">Aleatório</option>
            <option value="villain">Vilão</option>
            <option value="ally">Aliado</option>
            <option value="contact">Contato</option>
            <option value="hireling">Contratado</option>
          </select></div>
          <button onclick="executeGen(this)">Gerar NPC</button>
        `;
      } else if (ep.path === '/api/dungeons/generate') {
        gen.innerHTML += `
          <div class="field"><label>Tipo de masmorra</label><select id="gen-type">
            <option value="covil">Covil</option>
            <option value="labirinto">Labirinto</option>
            <option value="mina">Mina</option>
            <option value="tumba">Tumba</option>
            <option value="portal_planar">Portal Planar</option>
          </select></div>
          <div class="field"><label>Níveis</label><input type="number" id="gen-levels" value="1" min="1" max="10"></div>
          <div class="field"><label>Salas</label><input type="number" id="gen-rooms" value="10" min="1" max="100"></div>
          <button onclick="executeGen(this)">Gerar Masmorra</button>
        `;
      } else if (ep.path === '/api/monsters/create-quick') {
        gen.innerHTML += `
          <div class="field"><label>Nome do monstro</label><input type="text" id="gen-name" value="Monstro" placeholder="Nome"></div>
          <div class="field"><label>ND pretendido</label><input type="number" id="gen-cr" value="5" min="0" max="30"></div>
          <button onclick="executeGen(this)">Criar Monstro</button>
        `;
      } else {
        gen.innerHTML += `<button onclick="executeGen(this)">Executar</button>`;
      }
      content.appendChild(gen);

      document.querySelectorAll('.ep').forEach(e => e.classList.remove('active'));
      document.querySelectorAll('.ep').forEach(e => {
        if (e.querySelector('.path')?.textContent.trim() === shortPath(ep.path)) e.classList.add('active');
      });
    }

    async function executeGen(btn) {
      btn.disabled = true;
      btn.textContent = 'Gerando...';
      const form = btn.closest('.gen-form');
      const path = form.dataset.path;
      const body = {};

      const typeEl = form.querySelector('#gen-type');
      if (typeEl) body.type = typeEl.value;

      if (path === '/api/dungeons/generate') {
        body.levels = parseInt(form.querySelector('#gen-levels')?.value) || 1;
        body.rooms = parseInt(form.querySelector('#gen-rooms')?.value) || 10;
      }
      if (path === '/api/monsters/create-quick') {
        body.name = form.querySelector('#gen-name')?.value || 'Monstro';
        body.intendedCR = parseInt(form.querySelector('#gen-cr')?.value) || 5;
      }

      const ep = { method: 'POST', path, label: '' };
      await fetchEndpoint(ep, body);
      btn.disabled = false;
      btn.textContent = 'Gerar';
    }

    function formatJson(obj) {
      return syntaxHighlight(JSON.stringify(obj, null, 2));
    }

    function syntaxHighlight(json) {
      return json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"([^"]+)":/g, '<span class="key">"$1"</span>:')
        .replace(/: "([^"]*)"/g, (m) => {
          const val = m.slice(2, -1);
          if (val === 'null') return ': <span class="null">null</span>';
          return ': <span class="string">"' + val + '"</span>';
        })
        .replace(/: (\d+\.?\d*)/g, ': <span class="number">$1</span>')
        .replace(/: (true|false)/g, ': <span class="boolean">$1</span>')
        .replace(/: (null)/g, ': <span class="null">$1</span>')
        .replace(/([{\[\]}])/g, '<span class="bracket">$1</span>');
    }

    function copyJson(btn) {
      const pre = btn.closest('pre');
      const text = pre.textContent.replace('Copiar', '').trim();
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'Copiado!';
        setTimeout(() => btn.textContent = 'Copiar', 1500);
      });
    }

    function addHistory(method, path, status) {
      const time = new Date().toLocaleTimeString();
      history.unshift({ method, path, status, time });
      if (history.length > 20) history.pop();
      sessionStorage.setItem('api-history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const dd = document.getElementById('history-dropdown');
      dd.innerHTML = history.map(h => `
        <div class="history-item">
          <span class="hmethod ${h.method.toLowerCase()}">${h.method}</span>
          <span class="hpath">${h.path}</span>
          <span style="color:${h.status < 400 ? '#4c4' : '#c44'};font-size:0.7rem;">${h.status}</span>
          <span class="htime">${h.time}</span>
        </div>
      `).join('');
    }

    function showWelcome() {
      const welcome = document.getElementById('welcome');
      if (welcome) welcome.style.display = '';
    }

    document.getElementById('search').addEventListener('input', (e) => {
      renderSidebar(e.target.value);
    });

    document.getElementById('history-toggle').addEventListener('click', () => {
      document.getElementById('history-dropdown').classList.toggle('open');
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.history')) {
        document.getElementById('history-dropdown').classList.remove('open');
      }
    });

    fetch('/api/health')
      .then(r => r.json())
      .then(d => {
        const badge = document.getElementById('health-badge');
        badge.textContent = `🟢 OK (${Math.floor(d.uptime)}s)`;
        badge.className = 'badge ok';
      })
      .catch(() => {
        const badge = document.getElementById('health-badge');
        badge.textContent = '🔴 Offline';
        badge.className = 'badge err';
      });

    renderSidebar('');
    renderHistory();
  </script>
</body>
</html>
